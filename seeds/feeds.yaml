# News feeds. source_kind: srf | media | boulevard. fetch_article only where robots.txt AND the outlet's terms
# allow reading the article pages automatically; otherwise only the feed teaser is stored.
# Verified 2026-10-03 (status 200, robots.txt, terms): see docs/sources.md, "News feeds".
- name: SRF
  url: https://www.srf.ch/sport/bnf/rss/718
  source_kind: srf
  source_type: srf
  section_filter: /eishockey/
  fetch_article: true
# Blick: robots.txt allows /sport/..., but the Ringier AGB (section 11) forbid scraping/crawling without
# written permission -> teaser only.
- name: Blick
  url: https://www.blick.ch/sport/eishockey/rss.xml
  source_kind: boulevard
  source_type: other_media
  section_filter: /sport/eishockey/
  fetch_article: false
# 20 Minuten: story URLs carry no section, the feed itself is the ice hockey section. Robots legal notice forbids
# automated access without permission and blocks AI agents from /*story* -> teaser only.
- name: 20 Minuten
  url: https://partner-feeds.20min.ch/rss/20minuten/sport/eishockey
  source_kind: boulevard
  source_type: other_media
  section_filter: /story/
  fetch_article: false
# Watson: the ?tag=Eishockey feed was stale (newest item June 2026), so the Sport tag feed is used.
# robots.txt allows all (Crawl-delay 1); CH Media AGB need consent for automated retrieval -> teaser only.
- name: Watson
  url: https://www.watson.ch/api/1.0/rss/index.xml?tag=Sport
  source_kind: boulevard
  source_type: other_media
  section_filter: /sport/
  fetch_article: false
# NZZ: robots.txt allows * but blocks all AI crawlers; paywall -> teaser only.
- name: NZZ
  url: https://www.nzz.ch/sport/eishockey.rss
  source_kind: media
  source_type: other_media
  section_filter: /sport/
  fetch_article: false

