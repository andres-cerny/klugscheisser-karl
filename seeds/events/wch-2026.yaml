# Official WCh roster announcements: checked by klugscheisser/jobs/roster_watch.py (nightly step "kaderwatch",
# or by hand: klugscheisser wch-watch; all teams at once with a dry run first: klugscheisser wch-rosters).
# Free, one listing page per federation, robots.txt respected, bot protection never worked around.
# url + pattern = listing page and regex on link text + URL (lower case); exclude = links that look alike but are not
#   the WCh roster (camp lists, tune-up tournaments, roster updates); youth teams (U16/U18/U20) never count.
# parse = format of the official list page (roster_parsers.py / sihf); list_url (+ list_date) = that page when it is
#   already known, else the announcement found is read. The list is re-read every night (late replacements).
# Without a readable list the IIHF tournament roster mirrored on hockeycanada.ca is used once it is filled.
roster_watch:
  until: "2026-11-16"
  teams:
