facts:
  - topic: [modus, gruppen, uebersicht]
    text: "10 Teams in zwei Fünfergruppen. Neu (erstmals 2026) werden die Gruppen ausgeglichen nach Weltrangliste und Ergebnissen der letzten WM zusammengestellt, statt Top-5 in Gruppe A und die nächsten fünf in Gruppe B."
    quote: "Erstmals kommt an der WM ein neuer Turniermodus zur Anwendung: Statt einer Aufteilung in die fünf stärksten und fünf nächstplatzierten Nationen werden die Gruppen neu anhand der Weltrangliste und der Ergebnisse der vergangenen WM zusammengestellt."
    src: sihf_sod
  - topic: [modus, gruppen]
    text: "Gruppen nach dem Schlangensystem (serpentine) eingeteilt; Setzliste: USA 1, Kanada 2, Finnland 3, Tschechien 4, Schweiz 5, Schweden 6, Japan 7, Deutschland 8, Österreich 9, Dänemark 10."
    quote: "The serpentine system was used to organise the groups (rankings in brackets)."
    src: wiki_2026
  - topic: [modus, viertelfinal, abstieg, uebersicht]
    text: "Die besten vier jeder Gruppe kommen in die Viertelfinals; die Gruppenletzten spielen um den Abstieg."
    quote: "The top four teams will advance to the knockout phase, while the bottom teams will play the relegation playoff."
    src: wiki_2026
  - topic: [viertelfinal, modus]
    text: "Viertelfinal-Paarungen über Kreuz: Gruppenerster gegen Vierten der anderen Gruppe, Zweiter gegen Dritten der anderen Gruppe (A1–B4, B1–A4, A2–B3, B2–A3)."
    quote: "Quarter-finalists are paired according to their positions in the groups: the first-place team in each preliminary-round group plays the fourth-place team of the other group, while the second-place team plays the third-place team of the other group."
    src: wiki_2026
  - topic: [viertelfinal, halbfinal, modus]
    text: "Nach den Viertelfinals wird neu gesetzt: das bestklassierte Halbfinal-Team spielt gegen das schwächstklassierte, das zweitbeste gegen das drittbeste."
    quote: "The best-ranked semi-finalist plays against the lowest-ranked semi-finalist, while the second-best ranked semi-finalist plays the third-best ranked semi-finalist."
    src: wiki_2026
  - topic: [viertelfinal, halbfinal, modus]
    text: "Rangierung für die Setzung: 1) Gruppenplatz, 2) Punkte, 3) Tordifferenz, 4) erzielte Tore, 5) Setzung vor dem Turnier."
    quote: "Classification rules: 1) position in the group; 2) number of points; 3) goal difference; 4) number of goals scored for; 5) seeding number entering the tournament."
    src: wiki_2026
  - topic: [abstieg]
    text: "Relegationsspiel A5 gegen B5 am Freitag, 13.11.2026, 11:00, KVIK Hockey Arena Herning; die Verliererin steigt in die Division I A 2027 ab (ein Absteiger)."
    quote: "From 2026 on, the ten teams will be put into two groups of five, with the top four teams advancing to the knockout stage while the last-placed teams will play out the relegated team."
    src: wiki_wwc
  - topic: [spielplan, viertelfinal, halbfinal, final, uebersicht]
    text: "K.-o.-Phase: Freitag 13.11. Relegationsspiel und vier Viertelfinals, Sonntag 15.11. Halbfinals, Montag 16.11. Bronze- und Goldspiel."
    quote: "Am Freitag, 13. November, beginnt die K.-o.-Phase mit dem Relegationsspiel und den vier Viertelfinals in Herning. Die Halbfinals folgen am Sonntag, 15. November, bevor am Montag, 16. November, die Medaillenentscheidungen fallen."
    src: sihf_sod
  - topic: [spielplan, viertelfinal]
    text: "Viertelfinals am 13.11. um 15:00 und 19:00, je eines in Herning (KVIK Hockey Arena) und Esbjerg (Granly Hockey Arena) – laut Wikipedia; SIHF schreibt «die vier Viertelfinals in Herning». Welche Paarung wo spielt, ist nicht festgelegt."
    quote: "Granly Hockey Arena || Group A, Quarterfinals"
    src: wiki_2026
  - topic: [spielplan, final]
    text: "Bronzespiel Montag 16.11. 15:00, Final 16.11. 19:00, beide KVIK Hockey Arena Herning (laut Wikipedia; Halbfinal-Zeiten dort widersprüchlich, darum nicht übernommen)."
    quote: "Hosts Group B, the relegation game, the quarterfinals, semifinals, and final."
    src: wiki_2026
  - topic: [november, uebersicht]
    text: "Die Top-Division-WM wurde ab 2026 von April in den November verschoben (beschlossen von IIHF und PWHL, angekündigt 6.10.2025): so gibt es auch in Olympiajahren eine volle WM, und sie kollidiert weder mit dem Ende der PWHL-Saison noch mit deren Start. Die unteren Divisionen spielten 2026 noch im April und wechseln ab 2027 in den November."
    quote: "This allows for a full Women's Worlds even in Olympic years."
    src: ixsports
  - topic: [november]
    text: "Zweiter Grund: die Terminkollision mit der PWHL (Profiliga in Nordamerika) – der November vermeidet Konflikte mit Saisonende und Saisonstart."
    quote: "avoids conflict with both the end of the PWHL season and the beginning of the next."
    src: ixsports
  - topic: [teams, uebersicht]
    text: "25. Austragung der Top Division. Neu dabei: Österreich (Sieger der Division I, erstmals in der Top Division) und Dänemark (Zweiter der Division I, sofort wieder aufgestiegen); Ungarn und Norwegen stiegen 2025 nach nur einer Teilnahme wieder ab."
    quote: "They will be replaced by Division I champions Austria, who will make their debut in the top division, and runners-up, Denmark, who secured their immediate promotion back to the top division."
    src: wiki_2026
  - topic: [modus, alt]
    text: "Bis 2025 spielten die fünf Stärksten in Gruppe A (alle sicher im Viertelfinal), die nächsten fünf in Gruppe B; 2026 erstmals ausgeglichene Gruppen."
    quote: "Beginning in 2026, the number of teams will remain at 10 but the groups will be balanced"
    src: thn_format
  - topic: [geschichte, zukunft]
    text: "Nächste WMs: 2027 in Québec City (Kanada); 2028 in der Schweiz (Vergabe am IIHF-Kongress, 29.05.2026; Spielort laut Quelle noch offen)."
    quote: "2028 | Switzerland"
    src: wiki_wwc

