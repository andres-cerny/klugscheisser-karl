# PROPOSED news feeds for v5 phase 7 — NOT loaded by the code (rss.py reads seeds/feeds.yaml only).
# Ondřej reviews this list first. Details, robots.txt and terms per source: docs/news-sources-v5.md.
# Every feed below returned HTTP 200 with valid RSS/Atom (items with links and dates) on 2026-10-03,
# fetched with the project User-Agent. Extra fields vs feeds.yaml: language (ISO 639-1), country (IOC/IIHF code, as in the rest
# of the project: SUI, GER, DEN, NED, ...).
# source_kind: srf | public | media | boulevard | official. fetch_article: true only where robots.txt AND the
# terms allow automated reading of article pages; otherwise teaser only.

# --- Switzerland: SRG ---------------------------------------------------------------------------------
# RTS terms: private use only. Article links carry ?rts_source=rss_t, which robots.txt disallows
# (Disallow: /*?*rts_source=) -> strip it if article fetching is ever enabled.
- name: RTS Sport
  url: https://www.rts.ch/sport/hockey/?format=rss/news
  source_kind: public
  source_type: other_media
  section_filter: /sport/hockey/
  fetch_article: false
  language: fr
  country: SUI
# RSI: article links are short ids (https://www.rsi.ch/s/4131468), no section in the URL; the feed is the section.
- name: RSI Sport
  url: https://www.rsi.ch/sport/hockey/?f=rss
  source_kind: public
  source_type: other_media
  section_filter: null
  fetch_article: false
  language: it
  country: SUI

