meta:
  topic: Men's World Floorball Championships 1996-2024 (A-division / top tier), Switzerland's games and awards
  compiled: '2026-11-24'
  score_convention: score is always Switzerland's goals first; result W/D/L from Swiss view; OT/PSO games counted as W or L. Penalty-shootout games recorded with the shootout winner credited one extra goal
    (IFF convention, e.g. 2018 SF 4–5 PSO; German Wikipedia shows 5:6 n.P. for the same game).
  already_known_elsewhere: medallists, final scores, Swiss final placing per edition (see event.yaml)
