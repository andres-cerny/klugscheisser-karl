# Men's World Floorball Championships 2026 (16th Men's WFC), Tampere, Finland
# Compiled 2026-11-24 for Klugscheisser Karl (Unihockey project). Every fact has a source.
# Times: Finland is EET (UTC+2), Switzerland CET (UTC+1) in December -> Swiss time = local time - 1 h.
# Fields marked `unverified: true` or `inferred` are not stated verbatim by an official source.
event:
  name: "IFF Men's World Floorball Championships 2026"
  short: "Men's WFC 2026"
  edition: 16
  german: "16. Unihockey-Weltmeisterschaft der Männer"
  dates: {start: 2026-12-05, end: 2026-12-13}
  city: Tampere
  country: Finland
  organisers: [International Floorball Federation (IFF), Finnish Floorball Federation (Suomen Salibandyliitto)]
  official_site: https://freeoflimits.fi/en/home/   # brand "Free of Limits"; wfc2026.fi redirects here
  iff_event_page: https://floorball.sport/world-floorball-championships/wfc-men/
  iff_app: https://app.floorball.sport/league-organizer/217   # groups 2423-2426 = A-D (league ids)
  official_results_service: https://tulospalvelu.salibandy.fi/category/2702!sb2026int/tables   # Torneopal, competition sb2026int, class 2702
  mascot: {name: Vekku, what: "fox mascot designed by Finnish children's author/illustrator Mauri Kunnas; will also be used at Women's WFC 2027 Turku and then as joint mascot of Finland's national teams", source: https://freeoflimits.fi/mauri-kunnaksen-suunnittelema-mm-kisamaskotti-on-vekku/, retrieved: 2026-11-24}
  claim: "biggest sporting event in Finland in 2026 (Finnish Floorball Federation Secretary General Ville-Mikko Korkka)"
  claim_source: https://floorball.sport/here-are-the-groups-for-the-mens-wfc-2026/
  defending_champion: Finland   # won 2024 Malmö final vs Sweden 5-4 OT
  next_events:
    - {event: "Women's WFC 2027", city: Turku, country: Finland, source: https://floorball.sport/here-are-the-groups-for-the-mens-wfc-2026/}
    - {event: "Men's WFC 2028", country: Czechia, city: "Prague or Brno (open as of 2025-09)", source: https://unihockey.ch/nationalteams/mnner-a/news/mnner-wm-2028-in-prag-27714/}
    - {event: "From 2029: new IFF '7-event structure': WFC only every 4 years, European Championships (12 teams, double as WFC qualification) in between, new 'World Trophy'", source: https://unihockey.ch/nationalteams/mnner-a/news/neue-iff-eventstruktur-ab-2029-28107/, date: 2026-02-02}
  caution:
    - "unihockey.ch article 'Unihockey-WM in den USA!' (2026-04-01, WFC 2031/2032 in the USA, Trump quotes) is an APRIL FOOLS' joke - do not ingest as fact. https://unihockey.ch/nationalteams/mnner-a/news/unihockey-wm-in-den-usa-28280/"

venues:
  - name: Nokia Arena
    use: quarterfinals, semifinals, medal games (from QF on)
    note: "Finland's most modern arena, in Tampere city centre (official site)"
    source: https://freeoflimits.fi/faneille/tapahtumapaikat/
  - name: Hakametsä Ice Hall (Hakametsän jäähalli)
    use: group stage, playoffs, placement games
    note: "Finland's first ice hall ('Suomen ensimmäinen jäähalli'), in Kaleva district near the centre (official site); unihockey.ch calls it 'legendary'"
    source: https://freeoflimits.fi/faneille/tapahtumapaikat/
  - name: Kauppi Sports Center
    use: group stage, placement games
    note: "in Kauppi sports park near the centre"
    source: https://freeoflimits.fi/faneille/tapahtumapaikat/
venue_capacities: null   # not found on official site; gap
fan_zone: "Ideapark, Lempäälä (source: official site menu)"

format:
  teams: 16
  groups: 4 x 4 (A and B = top-ranked teams, C and D = lower-ranked), ranking + ballot draw
  match_length: "3 x 20 min (IFF app league info)"
  group_ballot: {date: 2026-03-05, place: "Nokia Arena, Tampere", source: https://floorball.sport/here-are-the-groups-for-the-mens-wfc-2026/}
  schedule_published: {date: 2026-04-08, source: https://floorball.sport/the-mens-world-floorball-championships-2026-match-schedule-has-been-published/, pdf: https://floorball.sport/wp-content/uploads/2026/04/IFFWFC2026_MatchSchedule_1920x1080px__08042026-v1.pdf}
  progression:
    - "A1, A2, B1, B2 go straight to the quarterfinals."
    - "Playoffs (9 Dec): A3-D2, A4-D1, B3-C2, B4-C1; winners to QF, losers to places 9-12."
    - "C3/C4/D3/D4 play for places 13-16."
    - "QF pairings (official results service): A1 v Winner(B3-C2), A2 v Winner(B4-C1), B1 v Winner(A3-D2), B2 v Winner(A4-D1)."
    - "SF1 = Winner(QF A1) v Winner(QF B2); SF2 = Winner(QF B1) v Winner(QF A2). Placement games for 5th/7th/9th/11th/13th/15th."
  progression_source: "https://salibandy.api.torneopal.com/taso/widget.php?competition=sb2026int&class=2702&group=5&widget=schedule (official results-service widget, retrieved 2026-11-24)"
  game_numbers_note: "The results service refers to playoff games as 'Häviäjä/Voittaja NN' (loser/winner of game NN). Game numbers 31-54 below are INFERRED from the order of match ids (id - 968250); the inference is internally consistent with all bracket references and with the IFF PDF (5th place 13 Dec 09:00, 7th place 12:00)."
  schedule_changes_note: "The April 2026 IFF PDF differs from the current results service in some playoff slots (e.g. PDF: A4-D1 16:00; now 10:00). unihockey.ch (2026-04-10) wrote that Switzerland's QF would be Thu 10 Dec 16:30 'whether directly or via playoff'; in the CURRENT schedule only A2 plays QF Thu 16:30; A3 path -> QF Fri 11 Dec 19:00 v B1, A4 path -> QF Fri 11 Dec 16:00 v B2. Always re-check the results service."
  swiss_paths:
    A1: "QF Thu 10 Dec 19:30 local / 18:30 CH v Winner(B3-C2), Nokia Arena"
    A2: "QF Thu 10 Dec 16:30 local / 15:30 CH v Winner(B4-C1), Nokia Arena"
    A3: "Playoff Wed 9 Dec 13:00 local / 12:00 CH v D2 (Hakametsä); if won: QF Fri 11 Dec 19:00 / 18:00 CH v B1"
    A4: "Playoff Wed 9 Dec 10:00 local / 09:00 CH v D1 (Hakametsä); if won: QF Fri 11 Dec 16:00 / 15:00 CH v B2"
  medal_games: {semifinals: "Sat 12 Dec 16:45 and 19:45 local (15:45 / 18:45 CH), Nokia Arena", bronze: "Sun 13 Dec 14:00 local (13:00 CH)", final: "Sun 13 Dec 17:15 local (16:15 CH)"}

referees:
