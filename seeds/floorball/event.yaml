groups:
  source: https://floorball.sport/here-are-the-groups-for-the-mens-wfc-2026/   # ballot 2026-03-05
  A: [Finland, Switzerland, Norway, Latvia]
  B: [Sweden, Czechia, Germany, Slovakia]
  C: [Slovenia, Estonia, Singapore, Thailand]
  D: [Denmark, Japan, Philippines, Canada]
  pots_note: "Pot 1: Sweden, Finland, Czechia, Latvia; pot 2: Switzerland, Norway, Germany, Slovakia. Switzerland dropped from pot 1 after 5th place 2024 (Latvia 4th). unihockey.ch 2026-03-05 https://unihockey.ch/nationalteams/mnner-a/news/gruppenauslosung-wm-2026-28199/"
  canada: "Canada won all three AMER qualification games v USA (13-1, 8-2, third game also won) in Georgetown, Texas, March 2026 (IFF lists the event as Austin, TX). https://floorball.sport/canada-secures-final-spot-in-wfc-2026/ (2026-03-21)"
  austria: "NOT qualified (not among the 16). See rosters/AUT.yaml."
  qualification_facts:
    - "35 teams registered; Solomon Islands and Hong Kong, China took part for the first time (IFF 'Event Evolution'). https://floorball.sport/world-floorball-championships/wfc-men/"
    - "Switzerland won EUR1 group in Liepāja (LAT), 4-7 Feb 2026: 27-1 v Netherlands, 21-0 v Great Britain, 6-2 v Norway (qualified), then lost 3-4 PSO v Latvia in the final game. unihockey.ch 28116/28117/28118/28120"
    - "Norway qualified only as 'lucky loser' after a 3-4 PSO loss to Slovenia; Denmark beat Poland in the decisive game; Sweden won EUR3 in Trenčín 100:1 on goals incl. 44-0 v Liechtenstein and 46-0 v Iceland, playing with borrowed sticks after lost luggage. unihockey.ch 2026-02-10 https://unihockey.ch/nationalteams/mnner-a/news/15-von-16-wm-pltzen-vergeben-28124/"

