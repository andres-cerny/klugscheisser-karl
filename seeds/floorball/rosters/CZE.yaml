squad_facts:
  - "20 players (2 GK, 7 D, 11 F) + 10 reserves (náhradníci). Head coaches Jaroslav Berka and Joonas Naava (announcement 2026-11-05)."
  - "Most WFC appearances: Ondřej Němeček and Marek Beneš (both Tatran Střešovice) - their 6th WFC (announcement)."
  - "WFC debutants: Jakub Buršík, Mikeš Motejzík, Šimon Stránský, Jan Zoufalý (announcement)."
  - "Club split: Florbal MB 8, Tatran Střešovice 5, Linköping IBK (SWE) 3, Florbal Vary 2, AC Sparta Praha 1, SC Classic (FIN) 1, Nokian KrP (FIN) 1 -> 5 players abroad (3 Sweden, 2 Finland). No player at a Swiss club."
  - "Youngest: Mikeš Motejzík (born 2008, 18); oldest: Lukáš Bauer (born 1991, 35) - birth years from ceskyflorbal.cz 'Širší kádr' https://www.ceskyflorbal.cz/national-team/detail/roster/1 (retrieved 2026-11-24)."
  - "Coach Berka (announcement): three lines with different identities; 'for the first time the four traditional Euro Floorball Tour teams do not enter the WFC as the four top seeds' because Latvia broke in at Malmö 2024."
  - "Schedule per announcement: first game Sunday 6 Dec; group opponents in order Germany, Sweden, Slovakia; CZE-SVK on 8 Dec 14:00 (ceskyflorbal.cz national-team page). Live on ČT sport."
