squad_facts:
  - "Qualified in Liepāja: decisive 9-3 (4-1, 3-1, 2-1) win over Spain (ERR https://sport.err.ee/1609935008/eesti-saalihokikoondis-paases-mm-finaalturniirile). Group opponents: Belgium, Italy, Czechia, Germany, Spain; top 3 qualified."
  - "Coach Risto Lall before the qualification: no test matches at all in 2025 and preparation not ideal; several former key players absent or retired -> chance for young players (saalihoki.ee u=2312)."
  - "Money: the federation runs a crowdfunding campaign on Minusportlane.ee, 'Eesti saalihokikoondis MMile!', target EUR 20,000, open until 13 Dec 2026, because existing support does not cover travel, accommodation and participation costs (saalihoki.ee u=2383, u=2388)."
  - "Three Savi players in the qualification squad (Robin, Sander, Oliver); Robin Savi and Stenver Savi also played the 3v3 WFC 2026 (saalihoki.ee u=2360). Family relationship not verified."
  - "Club blocks: Jõgeva SK Tähe (10) and Sparta Team Automaailm (8)."
