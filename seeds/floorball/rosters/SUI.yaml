squad_facts:
  - "20 players: 2 goalkeepers + 18 field players (announcement 2026-11-05)."
  - "10 players before their first A-WFC; Matteo Steiner, Gianluca Persici and goalkeeper Nils Schälin already played the World Games 2025; for the other 7 debutants it is their first major tournament."
  - "Average age 'knapp 25' = youngest Swiss WFC squad of the last eight championships (swiss unihockey). Own calculation from listed birth dates: 25.4 years at 5 Dec 2026; youngest Mika Hänni (19, b. 2007-11-04), oldest Marco Louis (32, b. 1994-04-06)."
  - "Most experienced: Jan Bürki, Noël Seiler, Jan Zaugg (several WFCs); they are the only 3 players left from the home WFC 2022 squad (unihockey.ch 2026-03-05)."
  - "Six players play in Sweden (Bürki - FBC Kalmarsund, Hermle - Växjö Vipers, Persici - Mullsjö AIS, Schmuki - Storvreta IBK, Noël Seiler - IBF Falun, Matteo Steiner - Nykvarns IBF). Five play for Floorball Thurgau (Janis Graf, Niklas Graf, Hänni, Mariotti, Elia Seiler), the photo caption of the announcement mentions Niklas Graf as both Thurgau player and debutant."
  - "Two pairs of brothers: Noël and Elia Seiler, Janis and Niklas Graf. At the EFT 2026-09-05 v Czechia both pairs played together in an A international for the first time; Noël Seiler got his 50th cap that day. https://unihockey.ch/nationalteams/mnner-a/news/schweiz-gewinnt-dank-unterzahl-tor-gegen-tschechien-28527/"
  - "Not in the WFC squad although in the Oct 2026 Biglen squad: Jan Ziehli, Jamie Britt, Julian Egli. Jamie Britt scored twice in the WFC-qualification win v Norway (6-2, 2026-02-06)."
  - "Pre-WFC camp 25-29 Nov 2026 in Thun and Biglen."
  - "Coach quote (Schönbeck): team with offensive qualities and high ball security; 'ambitioniert, motiviert und mutig'."
