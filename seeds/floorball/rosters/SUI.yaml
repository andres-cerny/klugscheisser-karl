  u23_prospects_note: "U23 (coach Olli Oilinki) regulars 2025/26 incl. goalkeepers Mathias Juon, Yves Walliser (b. 2007-08-28), Alessio Mura, Jannis Röst and field players Linus Arnold (b. 2004-12-07), Timon Anderegg (b. 2006-02-21), Nino Bühler (b. 2007-01-30), Matteo Gervasoni, Loris Murer, Sebastian Mathis, Christian Stucki, Maurice Aebersold, Oliver Wiedmer. Several current WFC players (Kunz, Janis/Niklas Graf, Hänni, Elia Seiler, Hermle) came through this U23 group in 2025/26."
  switched_nation: "Linus Hedlund (Zug United, b. 2008-02-23) won U19 WFC bronze with Switzerland v Sweden in May 2025 but was then selected by Sweden (his father's country) for the EFT Nov 2025 (unihockey.ch 27907)."
