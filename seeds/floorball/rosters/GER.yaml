squad_facts:
  - "19 of 20 players verified (18 field players from the federation post + GK Jan Saurbier from his club). 2nd goalkeeper unknown; candidates in the 2025-26 extended squad: Jan Lemke (Kloten-Dietlikon Jets), Jannis Michaelis (MFBC Leipzig), Pascal Reichert (WaSa St. Gallen), Henrik von Wangenheim (UHC Grünenmatt) - unverified which one."
  - "Germany finished 8th at WFC 2024 (Sweden); best ever 4th at WFC 2012 in Switzerland; first WFC 1996 (8th); IFF ranking 7th (floorball.de/team/herren, retrieved 2026-11-24). German jersey voted most beautiful of WFC 2024 by a fan magazine (same page)."
  - "Four verified squad players play in Switzerland: Andrin Caviezel (Kloten-Dietlikon Jets), Tino von Pritzbuer (WaSa St. Gallen), Adam Lundgren (UHC Uster), Michel Wöcke (HC Rychenberg Winterthur) - clubs per floorball.de extended squad 2025-26, may be outdated. One in Sweden (Jakob Heins, Pixbo IBK), two in Finland (Rasmus Pursio, Philipp Wilbrand, both EräViikingit), one in Czechia (Iven Tessmann, Floorball Ústí)."
  - "Brothers? Jonathan Heins (D, b. 2002) and Jakob Heins (F, b. 2004) share the surname - relation NOT verified."
  - "Youngest: Anton Weyrauch (b. 2006-12-22, 19 at the WFC); oldest: Adam Lundgren (b. 1993-11-17, 33)."
  - "Nils Hofferbert: 4th men's WFC (2021, 2022, 2024, 2026), German champion 2022 with DJK Holzbüttgen, club captain (DJK Holzbüttgen Instagram 2026-11-03 https://www.instagram.com/p/DfRrYsKAPbe/)."
  - "Flemming Kühl is captain of ETV Piranhhas Hamburg (club Instagram 2026-11-19 https://www.instagram.com/p/Df7oSyLDVoq/)."
