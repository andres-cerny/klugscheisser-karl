squad_facts:
  - "20 players: 2 goalkeepers + 18 field players (LFS 2026-11-17)."
  - "Half the squad (10) plays abroad, half in the Latvian ELVI florbola līga (LFS)."
  - "Five play in Switzerland (Haralds Ābele, Daniels Jānis Anis, Gustavs Griezītis, Pēteris Trekše, Markuss Dumpis); Pontus Zarins and Morics Krūmiņš in Sweden; Kārlis Stukāns in Finland; Rūdolfs Vilmanis in Czechia; Markuss Januševskis in Germany (LFS)."
  - "Only one change from the squad at the Four Nations tournament in Slovakia (mid-Nov 2026): Toms Akmeņlauks (Talsi) replaced Emīls Jančevskis (Ulbroka) (LFS)."
  - "Qualified in Liepāja, Feb 2026: 15-1 v Ukraine, 16-1 v Hungary, 8-2 v Slovenia, then beat Switzerland 4-3 after penalty shots in the final (LETA/sportazinas 2026-11-18)."
  - "WFC 2024: Latvia reached the semi-finals for the first time in history and finished 4th behind Finland, Sweden and Czechia (LETA/sportazinas 2026-11-18)."
  - "Group A schedule (LFS): 5 Dec 17:00 v Norway, 6 Dec 15:00 v Switzerland, 8 Dec 19:00 v Finland (hosts). Times as given by LFS (presumably Latvian/Finnish local time, EET = CET+1). unverified: timezone"
  - "Youngest: Haralds Ābele (born 2009); oldest: Artis Raitums (born 1987) - birth years per LFS list."
