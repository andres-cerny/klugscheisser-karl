squad_facts:
  - "20 players: 2 goalkeepers + 18 field players. 'The same team that won the WFC place in Liepāja in February' (federation, 2026-11-12)."
  - "Second WFC in a row: first ever WFC was 2024 in Sweden, finished 13th of 16 after a win over Thailand (STA/siol.net 2026-02-07)."
  - "Qualification Liepāja, Feb 2026: 2-0 v Hungary, 10-6 v Ukraine, 2-8 v Latvia; then decisive game v Norway (world no. 8) won 4-3 after penalty shots. Goals: David Pečlin, Nejc Peklaj 2; goalkeeper Tim Luznar saved the decisive shot in the last round. Slovenia was 16th in the world ranking (siol.net 2026-02-07 https://siol.net/sportal/hokej/slovenski-igralci-floorball-drugic-na-sp-683873)."
  - "Federation runs the social series 'Misija Tampere' (this post was 10 of 22) and asked fans for support ('Pomagajte nam zaigrati na SP', Facebook)."
  - "Family names: Bogataj (Aleksander, Tristan), Kohne (Blaž, Matevž), Peklaj (Luka - captain, Nejc), Podobnik (Anže, Luka); head coach Gorazd Tomc and player Blaž Tomc share a surname. Relationships NOT verified."
  - "Four Nations in Žilina, Nov 2026: lost heavily to Slovakia ('Slovinci schytali tucet' = conceded a dozen, SZFB 2026-11-13)."
