notes:
- 20 players (18 outfield + 2 goalkeepers), named by head coach Thomas Brottman on 2026-11-10 (press conference announced for 2026-11-06 page 'Se VM-truppen presenteras').
- '8 WFC debutants: Filip Wramdemark, Hampus Nydenfeldt, Oskar Hovlund, Oscar Magnusson, Emil Kalentun, Hugo Bertilsson, Filip Eriksson, Daniel Kalentun (source: announcement).'
- Storvreta IBK is the most represented club (6 players); Pixbo IBK 4; 3 players at Swiss clubs (announcement).
- 'Swiss connections: Niklas Ramirez and Albin Sjögren (Zug United), Oskar Weissbach (HC Rychenberg Winterthur).'
- 'Brottman''s quote: ''Det är en ung, hungrig och framåtlutad trupp, men ändå en trupp med rutin.'' Aim: win back gold after losing the 2024 home final in Malmö (to Finland).'
- Squad is identical to the Euro Floorball Tour squad of 2026-08-24 minus Emil Ruud (IBF Falun) and Benjamin Schill (Pixbo IBK) (https://via.tt.se/pressmeddelande/4510222/har-ar-herrlandslagets-trupp-till-euro-floorball-tour-ska-bli-lite-krispigare?publisherId=3236077).
- Caps/goals/assists/points from Svensk Innebandy all-time men's points list PDF dated 2026-10-01 (does not include October/November 2026 internationals).
- No late changes / injury replacements found as of 2026-11-24 (one web search only).
- innebandy.se event page says the WFC is shared between Tampere and Turku (group games in Hakametsä and Kauppi Sports Center, medal games in Nokia Arena); schedule times as printed there (likely Swedish
  time, unverified).
- 'Albin Sjögren tops this squad in national-team scoring: 105 caps, 95 goals, 73 assists, 168 points (Svensk Innebandy points list as of 2026-10-01); Emil Hallqvist Johansson has the most caps in the squad
  (109).'
- 'Per the Finnish federation, Sweden beat Finland 8-2 at the Euro Floorball Tour in September 2026, then lost 2-8 to Finland in Kokkola on 2026-10-18 (Niklas Ramirez scored Sweden''s opener after 37 seconds,
  assist Oscar Magnusson; Sweden goalkeeper Rasmus Ekström, not in the WFC squad). Source: https://www.sttinfo.fi/tiedote/72420389/salibandymiehet-komeaan-voittoon-ruotsista-kokkolan-mm-kenraalissa?lang=fi'
