status: provisional
status_note: "No final WFC squad article found on szfb.sk as of 2026-11-24 (newest men's articles: Four Nations in Žilina, 13-15 Nov 2026). Player list below = SZFB nomination for the camp in Biglen (SUI), 15-18 Oct 2026, called 'predposledný zraz' (second-to-last gathering) where 'the WFC line-up should gradually be finalised'. NOT the final WFC list. The IFF App has the official list (login)."
announced:
  date: 2026-10-14
  source_url: https://www.szfb.sk/sk/article/slovakov-caka-konfrontacia-so-svetovou-spickou
  source_title: "Slovákov čaká konfrontácia so svetovou špičkou (SZFB, Miroslav Hýlek, 2026-10-14) - Biglen camp nomination"
retrieved: 2026-11-24
squad_facts:
  - "HISTORIC: Slovakia beat Switzerland for the first time ever, 4-3 (SZFB: Švajčiarsko - SLOVENSKO 3:4 (0:0, 1:1, 2:3)) in Biglen on 2026-10-15/16 (article dated 2026-10-16; match on Friday 19:00). Goals SVK: Jakub Haša, Michal Dudovič, Tomáš Kvasnica 2. SUI: Jamie Britt, Levin Conrad, Pascal Schmuki. Best SVK player: Michal Pažák; coach Mrázek: 'in defence by far the best performance in history'; goalkeeper Maroš Giba praised. https://www.szfb.sk/sk/article/svajciari-%E2%80%9Epadli%E2%80%9C-v-suboji-so-slovakmi"
  - "Four Nations Floorball Challenge in Žilina, 13-15 Nov 2026: big win v Slovenia ('Slovinci schytali tucet' = Slovenia conceded a dozen), loss v Norway, 3-10 v Latvia -> Slovakia 3rd (SZFB 2026-11-15 https://www.szfb.sk/sk/article/po-noroch-prisla-kruta-prehra-aj-s-lotysmi). In that game Latvian Pēteris Trekše (Ronald Gašparík's teammate at SV Wiler-Ersigen) scored 3, Gustavs Griezītis 4."
  - "Gašparík about club-mate Trekše: 'He is unstoppable at our club too. Great shot and precise passes.' (SZFB 2026-11-15)"
  - "Qualified for the WFC at the qualification in Trenčín (home), 5-8 Feb 2026."
  - "Injuries/absences before Biglen: Batkovič (injured), Gajdoš (virus; still listed); Michal Dudovič and Samuel Virga back after long injuries; Vladimír Bačinský and Oliver Chochol named as replacements (SZFB 2026-10-14)."
  - "Coach Ševčík: 'We have a narrow pool of players able to play international floorball.'"
  - "Note: the SZFB article of 2026-10-14 says the WFC runs '3 to 14 December' - other sources (IFF/LOC) say 5-13 Dec."
