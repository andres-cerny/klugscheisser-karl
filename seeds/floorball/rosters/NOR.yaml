squad_facts:
  - "19 players: 2 goalkeepers, 6 defenders, 11 forwards (florbal.cz)."
  - "Four players will make their senior WFC debut (florbal.cz 'čtyři debutanti'; names not given)."
  - "Mix of Norwegian league clubs and players in Sweden (florbal.cz)."
  - "Tunet IBK provides 5 players (Gidske, Solheim, Frafjord, Hasselstrøm, Trandum Terjesen) - matches Tunet's own post 'fem av våre herrer' (Tunet IBK Facebook/Instagram)."
  - "Four Nations, Slovakia (Žilina, Nov 2026): Latvia 4-4 Norway; Norway beat Slovakia ('Nórski vikingovia boli nad sily slovenského tímu', SZFB 2026-11-14). NBF 2026-11-10 https://bandyforbundet.no/innebandy/?msswb-post=ukens-landskamper"
  - "Coach change in Sep 2026: Patric Löfborg (also head coach of Pixbo IBK) stepped down due to workload; Swede David Gillek took over (NBF 2026-09-09)."
  - "WFC qualification Liepāja, Feb 2026: Norway was 2nd in group A behind Switzerland (lost 2-6 to SUI on 2026-02-06, see SUI.yaml) and lost the game v Slovenia 3-4 after penalty shots on 2026-02-07 (siol.net); Norway still qualified - route not verified here."
