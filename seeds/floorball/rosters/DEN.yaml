squad_facts:
  - "Goal: back into the world's top 8 (Kozan: 'vores mål er at komme tilbage i Top-8 igen')."
  - "Continuity: large part of the WFC-qualification squad kept, plus younger players."
  - "Alliancen København provides most players (6); Sunds Seahawks and AaB Floorball 3 each (Avisen Danmark)."
  - "Five Danes at Swedish clubs: Jonatan Lie (Västerås IBF), Pontus Henriksen (Lindås IBK), Martin Törnhjelm and Gustav Hansen (Nykvarns IF), Axel Rasmussen (Malmö FBC)."
  - "Last tests in Sweden, 14-15 Nov 2026: 9-3 v Floda IBK and 3-1 v Lindome IBK (Avisen Danmark 2026-11-17)."
  - "Qualified for the WFC with a 'dramatic win over the Netherlands' (Avisen Danmark headline 'Danmark er klar til VM efter dramatisk sejr over Holland')."
  - "Brothers? Emil and Kasper Kajgaard both at AaB Floorball - relationship not verified."
