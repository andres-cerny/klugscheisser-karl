# Working language of clubs and leagues (curated by hand, versioned).
#
# Used by klugscheisser/facts/german.py to derive "German-speaking club years" per person from career stints,
# season stats and affiliations. Fabi's question: which players of OTHER nations could give an interview in
# German? Club years are only a clue ("wahrscheinlich"); "bestätigt" needs a German interview (step 2, facts
# kind `language_evidence`).
#
# Rules:
# - `language`: one code (de, fr, it, hu, cs, sk, en …) or a list for bilingual places ([fr, de]). A bilingual
#   club is shown as bilingual and never counted as plain German.
# - `match`: phrases matched on whole words of the normalised name (lower case, no accents, ß → ss, punctuation
#   → space). A trailing `*` allows more letters ("germany*" matches "germany2"). The first matching club wins,
#   so exceptions (HK Budapest in the German DFEL) come before any league rule.
# - `club`: display name; `group` entries (several clubs) show the name as written in the source.
# - "kein Hinweis" notes (not German-speaking) are shown for Swiss clubs and for entries with `warn: true`
#   (clubs playing in a German league, e.g. HK Budapest in the DFEL), so an assistant does not read "Swiss
#   league" or "DFEL" as German.
# - Leagues are used only when no club matched; Swiss leagues have no language (three language regions), so a
#   Swiss club must be listed here to count.
# - Never infer a language from a person's name or nationality. Add clubs here when they show up in careers.
version: 1
updated: 2026-10-25

