[project]
name = "klugscheisser"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ondrej Cerny", email = "118163742+andres-cerny@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mcp[cli]>=1.20",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.0",
    "starlette>=1.7.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
klugscheisser = "klugscheisser.cli:main"

[project.optional-dependencies]
apify = [
    "apify-client>=3.2.1",
]
llm = [
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
]
embed = [
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # long lines: formatter handles code, strings stay

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["network: hits the real network (skipped unless RUN_NETWORK_TESTS=1)"]
